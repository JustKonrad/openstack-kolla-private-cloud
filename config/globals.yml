---
kolla_base_distro: "ubuntu"

# With HAProxy disabled there is no real VIP: use the controller's management IP.
kolla_internal_vip_address: "192.168.200.100"

# eth0 = management and APIs, eth1 = Neutron tunnels (VXLAN), eth2 = external network
network_interface: "eth0"
api_interface: "eth0"
tunnel_interface: "eth1"
neutron_external_interface: "eth2"

# Single controller, so no load balancer in front of the APIs
enable_haproxy: "no"
enable_proxysql: "no"

enable_keystone: "yes"
enable_glance: "yes"
enable_nova: "yes"
enable_neutron: "yes"
enable_cinder: "yes"
enable_horizon: "yes"
# Swift was enabled too, but it never showed up in the service catalog (it needs rings
# prepared before deploying), so in practice we ran without object storage.
enable_swift: "yes"

# Cinder volumes on an LVM volume group on the storage node
enable_cinder_backend_lvm: "yes"
cinder_volume_group: "cinder-volumes"
